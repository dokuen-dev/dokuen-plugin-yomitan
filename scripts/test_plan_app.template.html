<!DOCTYPE html>
<!-- GENERATED by scripts/build_test_plan_app.py from the Markdown test plan. Do not edit by hand: edit the plan or test_plan_app.template.html, then rebuild. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anki Export Test Plan</title>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --text:#1c1b1a; --muted:#6b6b6b; --border:#e4e1db;
  --accent:#8a5a2b; --accent2:#c17a3a; --done:#e8f2e6; --donetext:#3f6b3f;
  --focusbg:#fff8ee; --code:#f1ede6; --danger:#a3402f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --card:#231f19; --text:#f1ece2; --muted:#a89f8f; --border:#3a3327;
    --accent:#e0a25c; --accent2:#e0a25c; --done:#22301f; --donetext:#a9d19e;
    --focusbg:#2a2116; --code:#2d281f; --danger:#e08a7a;
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --card:#231f19; --text:#f1ece2; --muted:#a89f8f; --border:#3a3327;
  --accent:#e0a25c; --accent2:#e0a25c; --done:#22301f; --donetext:#a9d19e;
  --focusbg:#2a2116; --code:#2d281f; --danger:#e08a7a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px;}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;z-index:5;border-bottom:1px solid var(--border);}
h1{font-size:1.15rem;margin:0 0 8px;}
.progressbar{height:8px;background:var(--code);border-radius:5px;overflow:hidden;margin-bottom:8px;}
.progressfill{height:100%;background:var(--accent);transition:width .2s;}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 12px;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.tab-active{background:var(--accent);border-color:var(--accent);color:#fff;}
.smallmuted{color:var(--muted);font-size:.85rem;}
.step{padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.step.done{background:var(--done);}
.step input[type=checkbox]{margin-top:3px;width:18px;height:18px;flex:none;}
.step .id{font-weight:700;color:var(--accent);font-size:.85rem;white-space:nowrap;}
.step.done .txt{color:var(--donetext);text-decoration:line-through;text-decoration-color:var(--donetext);opacity:.8;}
.txt ul{margin:6px 0 0;padding-left:22px;}
.txt li{margin:2px 0;}
code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em;}
details{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--card);overflow:hidden;}
summary{padding:10px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px;}
summary::-webkit-details-marker{display:none;}
summary .cnt{color:var(--muted);font-weight:400;font-size:.85rem;}
.phasenote{padding:0 12px 10px;color:var(--muted);font-size:.88rem;border-bottom:1px solid var(--border);margin-bottom:10px;}
.phasebody{padding:0 12px 12px;}
#focusCard{background:var(--focusbg);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:14px;}
#focusCard .id{font-size:1rem;}
#focusCard .phasetitle{color:var(--muted);font-size:.85rem;margin-bottom:6px;}
#focusCard .phasenote2{color:var(--muted);font-size:.85rem;margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
#focusCard .txt{font-size:1.05rem;margin:10px 0 16px;}
.focusbtns{display:flex;gap:10px;flex-wrap:wrap;}
.doneall{text-align:center;padding:40px 20px;color:var(--muted);}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px;}
:root{--failbg:#fbeae7;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--failbg:#3a2420;}}
:root[data-theme="dark"]{--failbg:#3a2420;}
.statusbtns{display:flex;gap:8px;margin:10px 0;}
.statusbtn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;}
.statusbtn.pass.active{background:var(--donetext);border-color:var(--donetext);color:#fff;}
.statusbtn.fail.active{background:var(--danger);border-color:var(--danger);color:#fff;}
.statusbtns.small{display:inline-flex;gap:4px;margin:4px 0;}
.statusbtns.small .statusbtn{padding:2px 9px;font-size:.85rem;}
textarea{font:inherit;width:100%;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px;resize:vertical;}
#focusCard textarea{min-height:70px;}
.note-input{min-height:34px;margin-top:6px;font-size:.9rem;}
.stepmain{display:flex;flex-direction:column;gap:2px;width:100%;}
.step{display:block;}
.step.pass{background:var(--done);}
.step.fail{background:var(--failbg);}
.step.pass .id{color:var(--donetext);}
.step.fail .id{color:var(--danger);}
.progressbar{display:flex;overflow:hidden;}
.progressfill.pass{background:var(--donetext);}
.progressfill.fail{background:var(--danger);}
.cpass{color:var(--donetext);font-weight:600;}
.cfail{color:var(--danger);font-weight:600;}
.findingnote{margin-top:6px;padding:8px 10px;background:var(--code);border-radius:8px;font-size:.9rem;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Anki Export: Manual Test Plan</h1>
  <div class="progressbar"><div class="progressfill pass" id="pfillPass"></div><div class="progressfill fail" id="pfillFail"></div></div>
  <div class="toprow">
    <span class="smallmuted" id="ptext"></span>
    <div class="tabs">
      <button id="tabFocus">Focus</button>
      <button id="tabFull">Full list</button>
      <button id="tabFindings">Findings</button>
      <button id="resetBtn" title="Clear progress">Reset</button>
    </div>
  </div>
</header>
<details class="howto" style="margin-top:12px"><summary>How to read this plan</summary><div class="phasebody" id="howtoBody" style="padding-top:8px"></div></details>

<div id="focusView"></div>
<div id="fullView" style="display:none"></div>
<div id="findingsView" style="display:none"></div>
<footer id="foot"></footer>
</div>

<script>
const PLAN = /*__PLAN__*/;
const PHASES = PLAN.phases;

// flatten
const STEPS=[];
PHASES.forEach(p=>p.steps.forEach(s=>STEPS.push({id:s[0],text:s[1],subs:s[2]||[],phase:p.n,phaseTitle:p.title,phaseNote:p.note})));

const LSKEY="ankiTestPlanResults_v1";
const IDXKEY="ankiTestPlanIndex_v1";
let results={};
try{ results = JSON.parse(localStorage.getItem(LSKEY)||"{}"); }catch(e){ results={}; }
let curIndex=0;
try{ curIndex = parseInt(localStorage.getItem(IDXKEY)||"0",10)||0; }catch(e){ curIndex=0; }
if(curIndex<0||curIndex>=STEPS.length) curIndex=0;

function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(results)); }catch(e){} }
function saveIndex(){ try{ localStorage.setItem(IDXKEY, String(curIndex)); }catch(e){} }
function fmt(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\n/g,"<br>");
}
function subsHtml(l){ return l&&l.length ? "<ul>"+l.map(n=>"<li>"+fmt(n.x)+subsHtml(n.c)+"</li>").join("")+"</ul>" : ""; }
function body(t,subs){ return fmt(t)+subsHtml(subs); }
function getR(id){ return results[id] || {status:null, note:""}; }
function setStatus(id,status){
  const r=getR(id);
  r.status = (r.status===status)?null:status;
  results[id]=r; save();
}
function setNote(id,text){
  const r=getR(id); r.note=text; results[id]=r; save();
}
function counts(){
  let pass=0, fail=0;
  STEPS.forEach(s=>{ const st=getR(s.id).status; if(st==="pass")pass++; else if(st==="fail")fail++; });
  return {pass:pass, fail:fail, pending:STEPS.length-pass-fail, total:STEPS.length};
}
function updateHeader(){
  const c=counts();
  document.getElementById("pfillPass").style.width=(c.pass/c.total*100)+"%";
  document.getElementById("pfillFail").style.width=(c.fail/c.total*100)+"%";
  document.getElementById("ptext").innerHTML = c.pass+' <span class="cpass">pass</span> &middot; '+c.fail+' <span class="cfail">fail</span> &middot; '+c.pending+' pending';
}

let view = "focus";
function setView(v){ view=v;
  document.getElementById("tabFocus").className = v==="focus"?"tab-active":"";
  document.getElementById("tabFull").className = v==="full"?"tab-active":"";
  document.getElementById("tabFindings").className = v==="findings"?"tab-active":"";
  document.getElementById("focusView").style.display = v==="focus"?"block":"none";
  document.getElementById("fullView").style.display = v==="full"?"block":"none";
  document.getElementById("findingsView").style.display = v==="findings"?"block":"none";
  render();
}

function gotoNextPending(){
  for(let i=curIndex+1;i<STEPS.length;i++){ if(!getR(STEPS[i].id).status){ curIndex=i; saveIndex(); render(); return; } }
  for(let i=0;i<STEPS.length;i++){ if(!getR(STEPS[i].id).status){ curIndex=i; saveIndex(); render(); return; } }
}

function renderFocus(){
  const el=document.getElementById("focusView");
  const s=STEPS[curIndex];
  const r=getR(s.id);
  el.innerHTML =
    '<div id="focusCard">'
    + '<div class="phasetitle">Phase '+s.phase+' &middot; '+s.phaseTitle+' &nbsp;('+(curIndex+1)+'/'+STEPS.length+')</div>'
    + (s.phaseNote?'<div class="phasenote2">'+fmt(s.phaseNote)+'</div>':'')
    + '<div class="id">Step '+s.id+'</div>'
    + '<div class="txt">'+body(s.text,s.subs)+'</div>'
    + '<div class="statusbtns">'
    + '<button class="statusbtn pass'+(r.status==="pass"?" active":"")+'" id="passBtn">\u2713 Pass</button>'
    + '<button class="statusbtn fail'+(r.status==="fail"?" active":"")+'" id="failBtn">\u2717 Fail</button>'
    + '</div>'
    + '<textarea id="noteInput" placeholder="Notes / findings for this step\u2026">'+r.note.replace(/</g,"&lt;")+'</textarea>'
    + '<div class="focusbtns" style="margin-top:12px">'
    + '<button id="prevBtn">&larr; Back</button>'
    + '<button class="primary" id="nextBtn">Next &rarr;</button>'
    + '<button id="jumpBtn">Jump to next pending</button>'
    + '</div></div>';
  document.getElementById("passBtn").onclick=()=>{ setStatus(s.id,"pass"); render(); };
  document.getElementById("failBtn").onclick=()=>{ setStatus(s.id,"fail"); render(); };
  document.getElementById("noteInput").oninput=(e)=>{ setNote(s.id,e.target.value); updateHeader(); };
  document.getElementById("prevBtn").onclick=()=>{ if(curIndex>0){curIndex--; saveIndex(); render();} };
  document.getElementById("nextBtn").onclick=()=>{ if(curIndex<STEPS.length-1){curIndex++; saveIndex(); render();} };
  document.getElementById("jumpBtn").onclick=gotoNextPending;
}

function renderFull(){
  const el=document.getElementById("fullView");
  el.innerHTML = PHASES.map(p=>{
    const stepsHtml = p.steps.map(([id,text,subs])=>{
      const r=getR(id);
      return '<div class="step'+(r.status?' '+r.status:'')+'"><div class="stepmain">'
        + '<span class="id">'+id+'</span>'
        + '<div class="txt">'+body(text,subs)+'</div>'
        + '<div class="statusbtns small">'
        + '<button class="statusbtn pass'+(r.status==="pass"?" active":"")+'" data-id="'+id+'" data-s="pass">\u2713 Pass</button>'
        + '<button class="statusbtn fail'+(r.status==="fail"?" active":"")+'" data-id="'+id+'" data-s="fail">\u2717 Fail</button>'
        + '</div>'
        + '<textarea class="note-input" data-id="'+id+'" placeholder="Notes\u2026">'+r.note.replace(/</g,"&lt;")+'</textarea>'
        + '</div></div>';
    }).join("");
    const c = p.steps.reduce((a,pair)=>{const st=getR(pair[0]).status; if(st==="pass")a.p++; else if(st==="fail")a.f++; return a;},{p:0,f:0});
    return '<details'+((c.p+c.f)<p.steps.length?' open':'')+'>'
      + '<summary>Phase '+p.n+' &middot; '+p.title+' <span class="cnt">'+c.p+' pass, '+c.f+' fail, '+(p.steps.length-c.p-c.f)+' pending</span></summary>'
      + (p.note?'<div class="phasenote">'+fmt(p.note)+'</div>':'')
      + '<div class="phasebody">'+stepsHtml+'</div>'
      + '</details>';
  }).join("");
  el.querySelectorAll('.statusbtn').forEach(b=>{
    b.addEventListener('click',()=>{ setStatus(b.getAttribute('data-id'), b.getAttribute('data-s')); render(); });
  });
  el.querySelectorAll('.note-input').forEach(t=>{
    t.addEventListener('input',()=>{ setNote(t.getAttribute('data-id'), t.value); });
  });
}

function renderFindings(){
  const el=document.getElementById("findingsView");
  const items = STEPS.filter(s=>{ const r=getR(s.id); return r.status==="fail" || (r.note && r.note.trim()); });
  if(!items.length){
    el.innerHTML='<div class="doneall">No failures or notes recorded yet.<br><span class="smallmuted">Mark a step Fail, or add a note, and it will show up here.</span></div>';
    return;
  }
  const text = items.map(s=>{
    const r=getR(s.id);
    return "Step "+s.id+" (Phase "+s.phase+" \u2014 "+s.phaseTitle+") ["+(r.status?r.status.toUpperCase():"NOTE")+"]"
      + (r.note && r.note.trim() ? ":\n  "+r.note.trim() : "");
  }).join("\n\n");
  el.innerHTML = '<div class="smallmuted" style="margin-bottom:8px">'+items.length+' item(s)</div>'
    + items.map(s=>{
      const r=getR(s.id);
      return '<div class="step '+(r.status||'')+'"><div class="stepmain">'
        + '<span class="id">'+s.id+'</span> <span class="smallmuted">Phase '+s.phase+' \u00b7 '+s.phaseTitle+'</span>'
        + '<div class="txt">'+body(s.text,s.subs)+'</div>'
        + (r.note && r.note.trim() ? '<div class="findingnote">'+fmt(r.note.trim())+'</div>' : '')
        + '</div></div>';
    }).join("")
    + '<textarea id="findingsCopyBox" readonly style="min-height:140px;margin-top:14px;">'+text.replace(/</g,"&lt;")+'</textarea>'
    + '<div style="margin-top:8px"><button class="primary" id="copyFindingsBtn">Copy findings as text</button></div>';
  document.getElementById("copyFindingsBtn").onclick=()=>{
    const box=document.getElementById("findingsCopyBox");
    box.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{ try{document.execCommand('copy');}catch(e){} });
    } else { try{document.execCommand('copy');}catch(e){} }
  };
}

function render(){ updateHeader(); if(view==="focus") renderFocus(); else if(view==="full") renderFull(); else renderFindings(); }

document.getElementById("tabFocus").onclick=()=>setView("focus");
document.getElementById("tabFull").onclick=()=>setView("full");
document.getElementById("tabFindings").onclick=()=>setView("findings");
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Clear all pass/fail marks and notes?")){ results={}; curIndex=0; save(); saveIndex(); render(); }
};

document.getElementById("howtoBody").innerHTML = PLAN.preamble.map(b=>
  b.t==="ul" ? "<ul>"+b.x.map(i=>"<li>"+fmt(i)+"</li>").join("")+"</ul>" : "<p>"+fmt(b.x)+"</p>").join("");
document.getElementById("foot").textContent = "Part 1 (Procedure) only. Quote the step ID when reporting an issue. Progress is saved in this browser only. Generated from "+PLAN.source+" (sha256 "+PLAN.hash+"); do not edit by hand.";
setView("focus");
</script>
</body>
</html>
