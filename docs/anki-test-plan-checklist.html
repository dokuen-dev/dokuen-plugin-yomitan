{"n":9,"title":"Duplicate detection (Android)","note":"All on Android: settings in the plugin's **Anki Export** tab, notes in AnkiDroid (with **All decks** chosen in its card browser). Use `AuditVocab` unless a step names another format. Every step that sets something in the plugin hides Dokuen's overlay first (see \"Changing a plugin setting\" at the top of Part 1), so each tap after a setting change is on a new scan, whose links read **Add**.","steps":[
["9.1", "AnkiDroid: in the card browser, search `\"Expression:椅子\" or \"Expression:鉛筆\"`. Confirm it finds no notes."],
["9.2", "Plugin: set scope **Collection**, across all models off, \"When a duplicate is detected\" = **Allow adding**. Scan `椅子` and tap **Add: AuditVocab** on 椅子【いす】. Confirm it succeeds: the link now reads **Added: AuditVocab**."],
["9.3", "Set **Prevent adding**. Scan `椅子` again and tap **Add: AuditVocab**. Confirm \"This note already exists in Anki.\" In AnkiDroid, confirm exactly 1 `椅子` note exists."],
["9.4", "Set **Allow overwriting**. Scan `椅子` again and tap **Add: AuditVocab**. Confirm it succeeds."],
["9.5", "Set **Allow adding**. Scan `椅子` again and tap **Add: AuditVocab**. In AnkiDroid, confirm 2 `椅子` notes now exist. Leave both."],
["9.6", "AnkiDroid: open **Add**. Type `AuditTerm`, deck `AuditTest`, Expression `鉛筆`, Reading `えんぴつ`, Glossary `seed-deck`, every other field empty, tag `audit-fixture-dup-scope`. Save. (This is \"Seed-Deck\".)"],
["9.7", "Same again, but deck `AuditTest::Sub` and Glossary `seed-sub` (\"Seed-Sub\"). In the card browser, confirm exactly 2 `鉛筆` notes exist, one per deck."],
["9.8", "Plugin: set **Prevent adding**, scope **Collection**. Scan `鉛筆` and tap **Add: AuditVocab**. Confirm \"already exists\"."],
["9.9", "Set scope **Deck**. Scan `鉛筆` again and tap **Add: AuditVocab**. Confirm \"already exists\" (Seed-Deck is in `AuditTest` itself)."],
["9.10", "AnkiDroid: search `\"Expression:鉛筆\" deck:AuditTest -deck:AuditTest::*` and delete that note (Seed-Deck). Search `\"Expression:鉛筆\"` and confirm exactly 1 note remains (Seed-Sub)."],
["9.11", "Plugin, scope still **Deck**: scan `鉛筆` and tap **Add: AuditVocab**. Confirm it is **not** a duplicate and a note is added (Seed-Sub is in a sub-deck, which **Deck** excludes)."],
["9.12", "AnkiDroid: delete the note just added, leaving only Seed-Sub."],
["9.13", "Plugin: set scope **Deck root**. Scan `鉛筆` and tap **Add: AuditVocab**. Confirm \"already exists\" (**Deck root** includes `AuditTest::Sub`)."],
["9.14", "AnkiDroid: delete Seed-Sub, then create Seed-Deck again as in 9.6."],
["9.15", "Plugin, scope **Deck root**: scan `鉛筆` and tap **Add: AuditSub** (whose deck is `AuditTest::Sub`). Confirm \"already exists\" (the search covers the root deck `AuditTest`, which holds Seed-Deck)."],
["9.16", "Set scope **Deck**. Scan `鉛筆` again and tap **Add: AuditSub**. Confirm it is **not** a duplicate and a note is added to `AuditTest::Sub` (Seed-Deck is outside `AuditTest::Sub`)."],
["9.17", "AnkiDroid: delete every `鉛筆` note. Open **Add**: type `AuditKanji` (a different note type), deck `AuditTest`, Character `鉛筆`, Kunyomi, Onyomi, and Glossary `n/a`, every other field empty. Save."],
["9.18", "Plugin: set scope **Collection**, across all models off. Scan `鉛筆` and tap **Add: AuditVocab**. Confirm it is **not** a duplicate (a different note type, not checked) and a note is added."],
["9.19", "AnkiDroid: delete the note just added. Plugin: turn across all models **on**. Scan `鉛筆` and tap **Add: AuditVocab**. Confirm \"already exists\": across all models compares each note's first field, whatever its name, so the `AuditKanji` note, whose first field `Character` is `鉛筆`, is a duplicate."],
["9.20", "Plugin: turn across all models off and set **Allow adding**. Scan `手紙` and tap **Add: AuditQuoteKey** on 手紙【てがみ】 (its Expression becomes `手紙\"`). Confirm it succeeds."],
["9.21", "Set **Prevent adding**. Scan `手紙` again and tap **Add: AuditQuoteKey**. Confirm \"already exists\". In AnkiDroid, search `手紙` and confirm exactly 1 note exists (the duplicate check found the note despite the quote in its first field)."],
["9.22", "Plugin: set **Allow adding**, scope **Collection**, across all models off."]
]},

};
const PHASES = PLAN.phases;

// flatten
const STEPS=[];
PHASES.forEach(p=>p.steps.forEach(s=>STEPS.push({id:s[0],text:s[1],subs:s[2]||[],phase:p.n,phaseTitle:p.title,phaseNote:p.note})));

const LSKEY="ankiTestPlanResults_v1";
const IDXKEY="ankiTestPlanIndex_v1";
let results={};
try{ results = JSON.parse(localStorage.getItem(LSKEY)||"{}"); }catch(e){ results={}; }
let curIndex=0;
try{ curIndex = parseInt(localStorage.getItem(IDXKEY)||"0",10)||0; }catch(e){ curIndex=0; }
if(curIndex<0||curIndex>=STEPS.length) curIndex=0;

function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(results)); }catch(e){} }
function saveIndex(){ try{ localStorage.setItem(IDXKEY, String(curIndex)); }catch(e){} }
function fmt(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\n/g,"<br>");
}
function subsHtml(l){ return l&&l.length ? "<ul>"+l.map(n=>"<li>"+fmt(n.x)+subsHtml(n.c)+"</li>").join("")+"</ul>" : ""; }
function body(t,subs){ return fmt(t)+subsHtml(subs); }
function getR(id){ return results[id] || {status:null, note:""}; }
function setStatus(id,status){
  const r=getR(id);
  r.status = (r.status===status)?null:status;
  results[id]=r; save();
}
function setNote(id,text){
  const r=getR(id); r.note=text; results[id]=r; save();
}
function counts(){
  let pass=0, fail=0;
  STEPS.forEach(s=>{ const st=getR(s.id).status; if(st==="pass")pass++; else if(st==="fail")fail++; });
  return {pass:pass, fail:fail, pending:STEPS.length-pass-fail, total:STEPS.length};
}
function updateHeader(){
  const c=counts();
  document.getElementById("pfillPass").style.width=(c.pass/c.total*100)+"%";
  document.getElementById("pfillFail").style.width=(c.fail/c.total*100)+"%";
  document.getElementById("ptext").innerHTML = c.pass+' <span class="cpass">pass</span> &middot; '+c.fail+' <span class="cfail">fail</span> &middot; '+c.pending+' pending';
}

let view = "focus";
function setView(v){ view=v;
  document.getElementById("tabFocus").className = v==="focus"?"tab-active":"";
  document.getElementById("tabFull").className = v==="full"?"tab-active":"";
  document.getElementById("tabFindings").className = v==="findings"?"tab-active":"";
  document.getElementById("focusView").style.display = v==="focus"?"block":"none";
  document.getElementById("fullView").style.display = v==="full"?"block":"none";
  document.getElementById("findingsView").style.display = v==="findings"?"block":"none";
  render();
}

function gotoNextPending(){
  for(let i=curIndex+1;i<STEPS.length;i++){ if(!getR(STEPS[i].id).status){ curIndex=i; saveIndex(); render(); return; } }
  for(let i=0;i<STEPS.length;i++){ if(!getR(STEPS[i].id).status){ curIndex=i; saveIndex(); render(); return; } }
}

function renderFocus(){
  const el=document.getElementById("focusView");
  const s=STEPS[curIndex];
  const r=getR(s.id);
  el.innerHTML =
    '<div id="focusCard">'
    + '<div class="phasetitle">Phase '+s.phase+' &middot; '+s.phaseTitle+' &nbsp;('+(curIndex+1)+'/'+STEPS.length+')</div>'
    + (s.phaseNote?'<div class="phasenote2">'+fmt(s.phaseNote)+'</div>':'')
    + '<div class="id">Step '+s.id+'</div>'
    + '<div class="txt">'+body(s.text,s.subs)+'</div>'
    + '<div class="statusbtns">'
    + '<button class="statusbtn pass'+(r.status==="pass"?" active":"")+'" id="passBtn">\u2713 Pass</button>'
    + '<button class="statusbtn fail'+(r.status==="fail"?" active":"")+'" id="failBtn">\u2717 Fail</button>'
    + '</div>'
    + '<textarea id="noteInput" placeholder="Notes / findings for this step\u2026">'+r.note.replace(/</g,"&lt;")+'</textarea>'
    + '<div class="focusbtns" style="margin-top:12px">'
    + '<button id="prevBtn">&larr; Back</button>'
    + '<button class="primary" id="nextBtn">Next &rarr;</button>'
    + '<button id="jumpBtn">Jump to next pending</button>'
    + '</div></div>';
  document.getElementById("passBtn").onclick=()=>{ setStatus(s.id,"pass"); render(); };
  document.getElementById("failBtn").onclick=()=>{ setStatus(s.id,"fail"); render(); };
  document.getElementById("noteInput").oninput=(e)=>{ setNote(s.id,e.target.value); updateHeader(); };
  document.getElementById("prevBtn").onclick=()=>{ if(curIndex>0){curIndex--; saveIndex(); render();} };
  document.getElementById("nextBtn").onclick=()=>{ if(curIndex<STEPS.length-1){curIndex++; saveIndex(); render();} };
  document.getElementById("jumpBtn").onclick=gotoNextPending;
}

function renderFull(){
  const el=document.getElementById("fullView");
  el.innerHTML = PHASES.map(p=>{
    const stepsHtml = p.steps.map(([id,text,subs])=>{
      const r=getR(id);
      return '<div class="step'+(r.status?' '+r.status:'')+'"><div class="stepmain">'
        + '<span class="id">'+id+'</span>'
        + '<div class="txt">'+body(text,subs)+'</div>'
        + '<div class="statusbtns small">'
        + '<button class="statusbtn pass'+(r.status==="pass"?" active":"")+'" data-id="'+id+'" data-s="pass">\u2713 Pass</button>'
        + '<button class="statusbtn fail'+(r.status==="fail"?" active":"")+'" data-id="'+id+'" data-s="fail">\u2717 Fail</button>'
        + '</div>'
        + '<textarea class="note-input" data-id="'+id+'" placeholder="Notes\u2026">'+r.note.replace(/</g,"&lt;")+'</textarea>'
        + '</div></div>';
    }).join("");
    const c = p.steps.reduce((a,pair)=>{const st=getR(pair[0]).status; if(st==="pass")a.p++; else if(st==="fail")a.f++; return a;},{p:0,f:0});
    return '<details'+((c.p+c.f)<p.steps.length?' open':'')+'>'
      + '<summary>Phase '+p.n+' &middot; '+p.title+' <span class="cnt">'+c.p+' pass, '+c.f+' fail, '+(p.steps.length-c.p-c.f)+' pending</span></summary>'
      + (p.note?'<div class="phasenote">'+fmt(p.note)+'</div>':'')
      + '<div class="phasebody">'+stepsHtml+'</div>'
      + '</details>';
  }).join("");
  el.querySelectorAll('.statusbtn').forEach(b=>{
    b.addEventListener('click',()=>{ setStatus(b.getAttribute('data-id'), b.getAttribute('data-s')); render(); });
  });
  el.querySelectorAll('.note-input').forEach(t=>{
    t.addEventListener('input',()=>{ setNote(t.getAttribute('data-id'), t.value); });
  });
}

function renderFindings(){
  const el=document.getElementById("findingsView");
  const items = STEPS.filter(s=>{ const r=getR(s.id); return r.status==="fail" || (r.note && r.note.trim()); });
  if(!items.length){
    el.innerHTML='<div class="doneall">No failures or notes recorded yet.<br><span class="smallmuted">Mark a step Fail, or add a note, and it will show up here.</span></div>';
    return;
  }
  const text = items.map(s=>{
    const r=getR(s.id);
    return "Step "+s.id+" (Phase "+s.phase+" \u2014 "+s.phaseTitle+") ["+(r.status?r.status.toUpperCase():"NOTE")+"]"
      + (r.note && r.note.trim() ? ":\n  "+r.note.trim() : "");
  }).join("\n\n");
  el.innerHTML = '<div class="smallmuted" style="margin-bottom:8px">'+items.length+' item(s)</div>'
    + items.map(s=>{
      const r=getR(s.id);
      return '<div class="step '+(r.status||'')+'"><div class="stepmain">'
        + '<span class="id">'+s.id+'</span> <span class="smallmuted">Phase '+s.phase+' \u00b7 '+s.phaseTitle+'</span>'
        + '<div class="txt">'+body(s.text,s.subs)+'</div>'
        + (r.note && r.note.trim() ? '<div class="findingnote">'+fmt(r.note.trim())+'</div>' : '')
        + '</div></div>';
    }).join("")
    + '<textarea id="findingsCopyBox" readonly style="min-height:140px;margin-top:14px;">'+text.replace(/</g,"&lt;")+'</textarea>'
    + '<div style="margin-top:8px"><button class="primary" id="copyFindingsBtn">Copy findings as text</button></div>';
  document.getElementById("copyFindingsBtn").onclick=()=>{
    const box=document.getElementById("findingsCopyBox");
    box.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{ try{document.execCommand('copy');}catch(e){} });
    } else { try{document.execCommand('copy');}catch(e){} }
  };
}

function render(){ updateHeader(); if(view==="focus") renderFocus(); else if(view==="full") renderFull(); else renderFindings(); }

document.getElementById("tabFocus").onclick=()=>setView("focus");
document.getElementById("tabFull").onclick=()=>setView("full");
document.getElementById("tabFindings").onclick=()=>setView("findings");
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Clear all pass/fail marks and notes?")){ results={}; curIndex=0; save(); saveIndex(); render(); }
};

document.getElementById("howtoBody").innerHTML = PLAN.preamble.map(b=>
  b.t==="ul" ? "<ul>"+b.x.map(i=>"<li>"+fmt(i)+"</li>").join("")+"</ul>" : "<p>"+fmt(b.x)+"</p>").join("");
document.getElementById("foot").textContent = "Part 1 (Procedure) only. Quote the step ID when reporting an issue. Progress is saved in this browser only. Generated from "+PLAN.source+" (sha256 "+PLAN.hash+"); do not edit by hand.";
setView("focus");
</script>
</body>
</html>
